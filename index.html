<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francis Lifts - Elite Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background: #05070A;
            color: white;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .gradient-text {
            background: linear-gradient(135deg, #dc2626 0%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glow-red { box-shadow: 0 0 25px rgba(220, 38, 38, 0.25); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        .day-node {
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .day-active {
            background: linear-gradient(135deg, #dc2626, #991b1b) !important;
            color: white !important;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.3);
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 85%;
            max-width: 320px;
            background: #0A0D12;
            z-index: 200;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .side-menu.open { transform: translateX(0); }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .overlay.open { opacity: 1; pointer-events: auto; }

        input, select {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: white !important;
        }
        
        input:focus { border-color: #dc2626 !important; outline: none; }

        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .timer-active { animation: pulse-red 1s infinite; }

        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .chart-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 2s linear forwards;
        }

        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Funkce pro získání dnů v aktuálním týdnu (začíná pondělím)
        const getWeekDays = (date) => {
            const start = new Date(date);
            const day = start.getDay();
            const diff = start.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(start.setDate(diff));
            
            return Array.from({ length: 7 }, (_, i) => {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                return d;
            });
        };

        // Funkce pro určení kategorie BMI
        const bmiCategory = (bmi) => {
            const val = parseFloat(bmi);
            if (val < 18.5) return { label: "Podváha", color: "text-blue-400" };
            if (val < 25) return { label: "Normální", color: "text-emerald-400" };
            if (val < 30) return { label: "Nadváha", color: "text-yellow-400" };
            return { label: "Obezita", color: "text-red-500" };
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name, className]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const TRAINING_SPLIT = {
            1: { name: "Pondělí", focus: "Záda / Biceps" },
            2: { name: "Úterý", focus: "Nohy" },
            3: { name: "Středa", focus: "Hrudník / Ramena" },
            4: { name: "Čtvrtek", focus: "Záda" },
            5: { name: "Pátek", focus: "Nohy" },
            6: { name: "Sobota", focus: "Rest Day" },
            0: { name: "Neděle", focus: "Hrudník / Triceps" }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('diary');
            const [selectedDate, setSelectedDate] = useState(() => {
                const d = new Date();
                d.setHours(0, 0, 0, 0); // Resetujeme čas pro přesné porovnávání
                return d;
            });
            const [timer, setTimer] = useState(null);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            
            const [calcWeight, setCalcWeight] = useState('');
            const [calcReps, setCalcReps] = useState('');
            
            const [profile, setProfile] = useState(() => {
                const saved = localStorage.getItem('francis_profile');
                return saved ? JSON.parse(saved) : { weight: 85, height: 180, age: 25 };
            });

            const [sets, setSets] = useState(() => {
                const saved = localStorage.getItem('francis_pro_sets');
                return saved ? JSON.parse(saved) : [];
            });

            const [weightHistory, setWeightHistory] = useState(() => {
                const saved = localStorage.getItem('francis_weight_history');
                return saved ? JSON.parse(saved) : [{ date: new Date().toISOString().split('T')[0], weight: 85 }];
            });

            const [newWeightEntry, setNewWeightEntry] = useState({ weight: '', date: new Date().toISOString().split('T')[0] });

            const [newSet, setNewSet] = useState({ exercise: '', weight: '', reps: '' });

            useEffect(() => {
                localStorage.setItem('francis_pro_sets', JSON.stringify(sets));
                localStorage.setItem('francis_profile', JSON.stringify(profile));
                localStorage.setItem('francis_weight_history', JSON.stringify(weightHistory));
            }, [sets, profile, weightHistory]);

            const bmi = useMemo(() => {
                const h = parseFloat(profile.height) / 100;
                const w = parseFloat(profile.weight);
                if (!h || !w) return "0.0";
                return (w / (h * h)).toFixed(1);
            }, [profile.weight, profile.height]);

            const weekDays = useMemo(() => getWeekDays(selectedDate), [selectedDate.getTime()]);
            
            const filteredSets = useMemo(() => {
                return sets.filter(s => {
                    const setDate = new Date(s.date);
                    return setDate.toDateString() === selectedDate.toDateString();
                });
            }, [sets, selectedDate]);

            const addSet = () => {
                if (!newSet.exercise || !newSet.weight || !newSet.reps) return;
                const setWithDate = { 
                    ...newSet, 
                    id: Date.now(), 
                    date: selectedDate.toISOString() 
                };
                setSets([setWithDate, ...sets]);
                setNewSet({ ...newSet, weight: '', reps: '' });
                setTimer(90);
            };

            const selectDateFromInput = (val) => {
                if (!val) return;
                const [year, month, day] = val.split('-').map(Number);
                const newD = new Date(year, month - 1, day);
                newD.setHours(0, 0, 0, 0);
                setSelectedDate(newD);
            };

            const deleteSet = (id) => {
                setSets(sets.filter(item => item.id !== id));
            };

            const oneRepMax = useMemo(() => {
                const w = parseFloat(calcWeight);
                const r = parseFloat(calcReps);
                if (!w || !r) return 0;
                if (r === 1) return w;
                return Math.round(w * (1 + r / 30));
            }, [calcWeight, calcReps]);

            const weightChartData = useMemo(() => {
                if (weightHistory.length < 2) return null;
                const sorted = [...weightHistory].sort((a, b) => new Date(a.date) - new Date(b.date));
                const weights = sorted.map(d => parseFloat(d.weight));
                const minW = Math.min(...weights) - 2;
                const maxW = Math.max(...weights) + 2;
                const range = maxW - minW || 1;
                
                const width = 300;
                const height = 150;
                
                const points = sorted.map((d, i) => {
                    const x = (i / (sorted.length - 1)) * width;
                    const y = height - ((parseFloat(d.weight) - minW) / range) * height;
                    return `${x},${y}`;
                }).join(' ');

                return { points, minW, maxW, sorted };
            }, [weightHistory]);

            const addWeightEntry = () => {
                if (!newWeightEntry.weight || !newWeightEntry.date) return;
                const updated = [...weightHistory.filter(h => h.date !== newWeightEntry.date), 
                    { weight: parseFloat(newWeightEntry.weight), date: newWeightEntry.date }];
                setWeightHistory(updated);
                setProfile({ ...profile, weight: parseFloat(newWeightEntry.weight) });
                setNewWeightEntry({ ...newWeightEntry, weight: '' });
            };

            return (
                <div className="min-h-screen bg-[#05070A] flex flex-col max-w-md mx-auto relative pb-28">
                    
                    {/* Overlay */}
                    <div className={`overlay ${isMenuOpen ? 'open' : ''}`} onClick={() => setIsMenuOpen(false)}></div>
                    
                    {/* Side Menu */}
                    <aside className={`side-menu ${isMenuOpen ? 'open' : ''} p-6 overflow-y-auto scrollbar-hide`}>
                        <div className="flex items-center justify-between mb-8">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center glow-red">
                                    <Icon name="user" size={20} />
                                </div>
                                <span className="font-black text-lg uppercase tracking-tight italic">Profil</span>
                            </div>
                            <button onClick={() => setIsMenuOpen(false)} className="text-white/40"><Icon name="x" size={24} /></button>
                        </div>
                        
                        <div className="space-y-6">
                            {/* Personal Details */}
                            <div className="space-y-4 bg-white/5 p-5 rounded-3xl border border-white/5">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black uppercase text-white/30 tracking-widest px-1">Věk</label>
                                        <input 
                                            type="number" value={profile.age} 
                                            onChange={e => setProfile({...profile, age: e.target.value})}
                                            className="w-full p-3 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black uppercase text-white/30 tracking-widest px-1">Váha (kg)</label>
                                        <input 
                                            type="number" value={profile.weight} 
                                            onChange={e => setProfile({...profile, weight: e.target.value})}
                                            className="w-full p-3 rounded-xl font-bold"
                                        />
                                    </div>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black uppercase text-white/30 tracking-widest px-1">Výška (cm)</label>
                                    <input 
                                        type="number" value={profile.height} 
                                        onChange={e => setProfile({...profile, height: e.target.value})}
                                        className="w-full p-3 rounded-xl font-bold"
                                    />
                                </div>
                            </div>

                            {/* BMI Analysis */}
                            <div className="glass p-5 rounded-3xl flex items-center justify-between">
                                <div>
                                    <div className="text-[10px] font-black uppercase text-white/30 mb-1">Tvůj Index BMI</div>
                                    <div className="text-3xl font-black italic">{bmi}</div>
                                </div>
                                <div className="text-right">
                                    <div className="text-[10px] font-black uppercase text-white/30 mb-1">Kategorie</div>
                                    <div className={`font-black uppercase text-sm ${bmiCategory(bmi).color}`}>{bmiCategory(bmi).label}</div>
                                </div>
                            </div>

                            {/* Integration Section */}
                            <div className="space-y-3">
                                <div className="text-[10px] font-black uppercase text-white/30 tracking-widest px-1">Propojení</div>
                                <div className="w-full p-4 rounded-2xl bg-white/5 border border-white/5 flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <Icon name="heart" size={18} className="text-red-500" />
                                        <span className="text-sm font-bold">Apple Health</span>
                                    </div>
                                    <div className="w-10 h-5 bg-white/10 rounded-full relative">
                                        <div className="absolute right-1 top-1 w-3 h-3 bg-white/20 rounded-full"></div>
                                    </div>
                                </div>
                                <p className="text-[9px] text-white/20 italic px-2">
                                    Pozn: Přímá synchronizace s HealthKit vyžaduje nativní aplikaci.
                                </p>
                            </div>
                        </div>

                        <div className="mt-auto pt-8">
                             <button 
                                onClick={() => { if(confirm('Smazat data?')) { localStorage.clear(); window.location.reload(); } }}
                                className="w-full p-4 rounded-2xl bg-red-600/10 border border-red-500/20 text-red-500 text-xs font-black uppercase tracking-widest"
                            >
                                Resetovat vše
                            </button>
                        </div>
                    </aside>

                    {/* Header */}
                    <header className="p-6 sticky top-0 bg-black/40 backdrop-blur-2xl z-50 border-b border-white/5 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsMenuOpen(true)} className="p-2 -ml-2 text-white/60 hover:text-white transition-colors">
                                <Icon name="menu" size={24} />
                            </button>
                            <span className="font-black italic tracking-tighter text-xl uppercase leading-none">FRANCIS <span className="gradient-text">LIFTS</span></span>
                        </div>
                        <div className="flex items-center gap-3">
                            {timer !== null && (
                                <div className="bg-red-600 px-3 py-1.5 rounded-full text-[10px] font-black timer-active flex items-center gap-2 shadow-lg shadow-red-600/20">
                                    <Icon name="clock" size={10} />
                                    {Math.floor(timer / 60)}:{(timer % 60).toString().padStart(2, '0')}
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="p-4 space-y-6">
                        {activeTab === 'diary' && (
                            <div className="space-y-6 animate-in slide-in-from-right duration-300">
                                
                                {/* Calendar Section */}
                                <section className="glass p-5 rounded-[32px] space-y-4">
                                    <div className="flex justify-between items-end">
                                        <div>
                                            <div className="text-[10px] font-black uppercase tracking-widest text-white/30 mb-1">Historie Tréninků</div>
                                            <div className="text-lg font-black text-white">{selectedDate.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long' })}</div>
                                        </div>
                                        <div className="relative">
                                            <input 
                                                type="date" 
                                                value={selectedDate.toISOString().split('T')[0]}
                                                className="opacity-0 absolute inset-0 w-full h-full cursor-pointer z-10"
                                                onChange={(e) => selectDateFromInput(e.target.value)}
                                            />
                                            <div className="bg-red-600/10 p-3 rounded-2xl border border-red-500/20 text-red-500 hover:bg-red-600/20 transition-all pointer-events-none">
                                                <Icon name="calendar" size={18} />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex justify-between gap-1">
                                        {weekDays.map((d, i) => {
                                            const isSelected = d.toDateString() === selectedDate.toDateString();
                                            const today = new Date();
                                            today.setHours(0,0,0,0);
                                            const isToday = d.toDateString() === today.toDateString();
                                            return (
                                                <div 
                                                    key={i} 
                                                    onClick={() => {
                                                        const newD = new Date(d);
                                                        newD.setHours(0,0,0,0);
                                                        setSelectedDate(newD);
                                                    }}
                                                    className={`day-node flex-1 ${isSelected ? 'day-active' : 'bg-white/5 text-white/30'} ${isToday && !isSelected ? 'border border-red-600/50' : ''}`}
                                                >
                                                    <span className="text-[9px] font-bold mb-1 opacity-60">{TRAINING_SPLIT[d.getDay()].name.substring(0, 2)}</span>
                                                    <span className="text-sm font-black">{d.getDate()}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    
                                    <div className="bg-black/40 p-4 rounded-2xl border border-white/5 flex items-center justify-between">
                                        <div>
                                            <div className="text-[9px] font-black text-white/20 uppercase mb-1">Dnešní Plán</div>
                                            <div className="text-sm font-black italic">{TRAINING_SPLIT[selectedDate.getDay()].focus}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[9px] font-black text-white/20 uppercase mb-1">Série</div>
                                            <div className="text-sm font-black text-red-500">{filteredSets.length}</div>
                                        </div>
                                    </div>
                                </section>

                                {/* Rest Timer */}
                                <div className="flex gap-2 justify-center overflow-x-auto pb-2 scrollbar-hide">
                                    {[60, 90, 180, 300].map(s => (
                                        <button 
                                            key={s}
                                            onClick={() => setTimer(s)}
                                            className={`px-4 py-3 rounded-2xl bg-white/5 border border-white/10 text-[10px] font-black uppercase whitespace-nowrap hover:bg-red-600 hover:text-white transition-all flex items-center gap-2 ${s === 300 ? 'border-red-500/50 text-red-500' : ''}`}
                                        >
                                            <Icon name="clock" size={14} />
                                            {s >= 60 ? `${s/60}m` : `${s}s`}
                                        </button>
                                    ))}
                                </div>

                                {/* Input Area */}
                                <div className="glass p-6 rounded-[32px] border-t border-red-600/30 space-y-4">
                                    <input 
                                        placeholder="Název cviku"
                                        className="w-full p-4 rounded-2xl text-sm font-bold"
                                        value={newSet.exercise}
                                        onChange={e => setNewSet({...newSet, exercise: e.target.value})}
                                    />
                                    <div className="flex gap-3">
                                        <input 
                                            type="number" placeholder="kg"
                                            className="w-1/2 p-4 rounded-2xl text-center font-black text-lg"
                                            value={newSet.weight}
                                            onChange={e => setNewSet({...newSet, weight: e.target.value})}
                                        />
                                        <input 
                                            type="number" placeholder="reps"
                                            className="w-1/2 p-4 rounded-2xl text-center font-black text-lg"
                                            value={newSet.reps}
                                            onChange={e => setNewSet({...newSet, reps: e.target.value})}
                                        />
                                    </div>
                                    <button 
                                        onClick={addSet}
                                        className="w-full bg-red-600 py-4 rounded-2xl font-black uppercase text-sm tracking-widest glow-red active:scale-95 transition-all"
                                    >
                                        Uložit Sérii
                                    </button>
                                </div>

                                {/* List of Sets */}
                                <div className="space-y-3">
                                    {filteredSets.length === 0 ? (
                                        <div className="text-center py-12 text-white/10 font-black italic uppercase tracking-widest">Žádný záznam pro tento den</div>
                                    ) : (
                                        filteredSets.map(s => (
                                            <div key={s.id} className="glass p-4 rounded-2xl flex justify-between items-center animate-in slide-in-from-left duration-300">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center font-black text-xs text-red-500">
                                                        {s.weight}
                                                    </div>
                                                    <div>
                                                        <div className="font-black text-sm uppercase">{s.exercise}</div>
                                                        <div className="text-[10px] text-white/40 uppercase font-bold">{s.reps} opakování</div>
                                                    </div>
                                                </div>
                                                <button onClick={() => deleteSet(s.id)} className="p-2 text-white/20 hover:text-red-500 transition-all">
                                                    <Icon name="trash" size={14} />
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'weight' && (
                            <div className="space-y-6 animate-in slide-in-from-right duration-300">
                                <div className="px-2">
                                    <h3 className="text-xl font-black italic uppercase">Sledování <span className="text-red-500">Váhy</span></h3>
                                    <p className="text-[10px] text-white/30 uppercase font-black tracking-widest mt-1">Tvůj progres tělesné hmotnosti</p>
                                </div>

                                {/* Graph Section */}
                                <div className="glass p-6 rounded-[32px] overflow-hidden">
                                    {weightChartData ? (
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-end mb-2">
                                                <div className="text-xs font-bold text-white/40">{weightChartData.minW}kg</div>
                                                <div className="text-xs font-bold text-red-500">{weightChartData.maxW}kg</div>
                                            </div>
                                            <svg viewBox="0 0 300 150" className="w-full h-40 overflow-visible">
                                                <path 
                                                    d={`M ${weightChartData.points}`} 
                                                    fill="none" 
                                                    stroke="url(#grad)" 
                                                    strokeWidth="4" 
                                                    strokeLinecap="round" 
                                                    strokeLinejoin="round"
                                                    className="chart-line"
                                                />
                                                <defs>
                                                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                                        <stop offset="0%" style={{stopColor: '#dc2626', stopOpacity: 1}} />
                                                        <stop offset="100%" style={{stopColor: '#f97316', stopOpacity: 1}} />
                                                    </linearGradient>
                                                </defs>
                                                {/* Points */}
                                                {weightChartData.points.split(' ').map((p, i) => {
                                                    const [x, y] = p.split(',');
                                                    return <circle key={i} cx={x} cy={y} r="4" fill="white" />;
                                                })}
                                            </svg>
                                            <div className="flex justify-between text-[8px] font-black uppercase text-white/20 mt-4">
                                                <span>{new Date(weightChartData.sorted[0].date).toLocaleDateString()}</span>
                                                <span>{new Date(weightChartData.sorted[weightChartData.sorted.length-1].date).toLocaleDateString()}</span>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="py-12 text-center text-white/10 font-black uppercase tracking-widest text-sm">
                                            Potřebuješ alespoň 2 záznamy pro graf
                                        </div>
                                    )}
                                </div>

                                {/* Weight Input */}
                                <div className="glass p-6 rounded-[32px] border-t border-red-600/30 space-y-4">
                                    <div className="flex gap-3">
                                        <div className="flex-1 space-y-1">
                                            <label className="text-[10px] font-black uppercase text-white/30 tracking-widest px-1">Nová Váha</label>
                                            <input 
                                                type="number" placeholder="kg"
                                                className="w-full p-4 rounded-2xl text-center font-black text-xl"
                                                value={newWeightEntry.weight}
                                                onChange={e => setNewWeightEntry({...newWeightEntry, weight: e.target.value})}
                                            />
                                        </div>
                                        <div className="flex-1 space-y-1">
                                            <label className="text-[10px] font-black uppercase text-white/30 tracking-widest px-1">Datum</label>
                                            <input 
                                                type="date"
                                                className="w-full p-4 rounded-2xl text-center font-bold text-sm h-[60px]"
                                                value={newWeightEntry.date}
                                                onChange={e => setNewWeightEntry({...newWeightEntry, date: e.target.value})}
                                            />
                                        </div>
                                    </div>
                                    <button 
                                        onClick={addWeightEntry}
                                        className="w-full bg-red-600 py-4 rounded-2xl font-black uppercase text-sm tracking-widest glow-red active:scale-95 transition-all"
                                    >
                                        Uložit Váhu
                                    </button>
                                </div>

                                {/* History List */}
                                <div className="space-y-2">
                                    {[...weightHistory].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5).map((h, i) => (
                                        <div key={i} className="glass p-4 rounded-2xl flex justify-between items-center opacity-60 hover:opacity-100 transition-opacity">
                                            <span className="text-xs font-bold text-white/40">{new Date(h.date).toLocaleDateString()}</span>
                                            <span className="font-black">{h.weight} kg</span>
                                            <button 
                                                onClick={() => setWeightHistory(weightHistory.filter(item => item.date !== h.date))}
                                                className="text-white/10 hover:text-red-500"
                                            >
                                                <Icon name="trash" size={12} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'prs' && (
                            <div className="space-y-4 animate-in fade-in duration-500">
                                <h3 className="text-xl font-black italic uppercase px-2">Tvoje <span className="text-red-500">Rekordy</span></h3>
                                <div className="grid gap-3">
                                    {Array.from(new Set(sets.map(s => s.exercise))).length === 0 ? (
                                        <div className="text-center py-12 text-white/10 font-black uppercase">Zatím žádné rekordy</div>
                                    ) : (
                                        Array.from(new Set(sets.map(s => s.exercise))).map((ex, i) => {
                                            const exerciseSets = sets.filter(s => s.exercise.toLowerCase() === ex.toLowerCase());
                                            const best = exerciseSets.reduce((max, s) => parseFloat(s.weight) > parseFloat(max.weight) ? s : max, { weight: 0 });
                                            return (
                                                <div key={i} className="glass p-5 rounded-3xl flex justify-between items-center">
                                                    <div>
                                                        <div className="text-[10px] font-black text-white/30 uppercase mb-1">{ex}</div>
                                                        <div className="text-2xl font-black">{best.weight} kg</div>
                                                    </div>
                                                    <div className="w-12 h-12 bg-red-600/10 rounded-2xl flex items-center justify-center text-red-500">
                                                        <Icon name="award" size={24} />
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'calc' && (
                            <div className="space-y-6 animate-in slide-in-from-bottom duration-500">
                                <div className="px-2">
                                    <h3 className="text-xl font-black italic uppercase">Kalkulačka <span className="text-red-500">1RM</span></h3>
                                    <p className="text-[10px] text-white/30 uppercase font-black tracking-widest mt-1">Odhad tvého maxima na jedno opakování</p>
                                </div>

                                <div className="glass p-8 rounded-[40px] border-t border-red-500/20 text-center space-y-8">
                                    <div className="relative inline-block">
                                        <div className="absolute -inset-4 bg-red-600/20 blur-2xl rounded-full"></div>
                                        <div className="relative">
                                            <div className="text-[10px] font-black text-red-500 uppercase tracking-[0.2em] mb-2">Předpokládané Maximum</div>
                                            <div className="text-7xl font-black italic text-white flex items-baseline justify-center gap-2">
                                                {oneRepMax}
                                                <span className="text-xl text-white/20 not-italic">kg</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-white/30 tracking-widest block">Váha (kg)</label>
                                            <input 
                                                type="number" 
                                                placeholder="0"
                                                value={calcWeight}
                                                onChange={e => setCalcWeight(e.target.value)}
                                                className="w-full bg-white/5 border border-white/10 p-5 rounded-3xl text-2xl font-black text-center focus:border-red-500 transition-all"
                                            />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase text-white/30 tracking-widest block">Opakování</label>
                                            <input 
                                                type="number" 
                                                placeholder="0"
                                                value={calcReps}
                                                onChange={e => setCalcReps(e.target.value)}
                                                className="w-full bg-white/5 border border-white/10 p-5 rounded-3xl text-2xl font-black text-center focus:border-red-500 transition-all"
                                            />
                                        </div>
                                    </div>

                                    <div className="bg-black/40 p-5 rounded-3xl border border-white/5">
                                        <p className="text-[11px] text-white/40 italic leading-relaxed">
                                            Vypočteno pomocí <span className="text-white/60 font-bold">Epleyho formule</span>. 
                                            Tento výpočet je nejpřesnější pro rozsah 2-10 opakování.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Bottom Navbar */}
                    <nav className="fixed bottom-6 left-4 right-4 max-w-md mx-auto glass rounded-[28px] p-3 flex justify-around items-center z-[100] shadow-2xl">
                        {[
                            { id: 'diary', icon: 'calendar', label: 'Deník' },
                            { id: 'prs', icon: 'trophy', label: 'Best' },
                            { id: 'weight', icon: 'trending-up', label: 'Váha' },
                            { id: 'calc', icon: 'zap', label: '1RM' }
                        ].map(t => (
                            <button 
                                key={t.id}
                                onClick={() => setActiveTab(t.id)}
                                className={`flex flex-col items-center gap-1.5 px-4 py-2 rounded-2xl transition-all duration-300 ${activeTab === t.id ? 'text-red-500 scale-110 bg-red-600/5' : 'text-white/20'}`}
                            >
                                <Icon name={t.icon} size={20} className={activeTab === t.id ? 'stroke-[2.5px]' : 'stroke-[2px]'} />
                                <span className="text-[9px] font-black uppercase tracking-tighter">{t.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
